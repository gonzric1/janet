name: "Celtic Cross Spread"
slots:
  - position: "1. Present"
    meaning: "Represents the current situation."
  - position: "2. Challenge"
    meaning: "Represents the immediate challenge."
  - position: "3. Past"
    meaning: "Represents the past events."
  - position: "4. Future"
    meaning: "Represents the near future."
  - position: "5. Above"
    meaning: "Represents the goal or aspiration."
  - position: "6. Below"
    meaning: "Represents the subconscious influence."
  - position: "7. Advice"
    meaning: "Represents the advice or guidance."
  - position: "8. External Influences"
    meaning: "Represents the external influences."
  - position: "9. Hopes and Fears"
    meaning: "Represents the hopes and fears."
  - position: "10. Outcome"
    meaning: "Represents the final outcome."
